name: Vox Mana Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    name: Deterministic Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic checks
        run: |
          npm run test:workflow-instructions
          npm run test:task-context
          npm run test:admission
          npm run test:task-delivery
          npm run test:change-report
          npm run task -- indexes --check
          npm run lint:html
          npm run lint:js
          npm run validate:source-generated
          npm run test:parser
          npm run test:placement
          npm run test:maze-finds
          npm run test:deck-links
          npm run test:copy-boundaries
          npm run test:frontend-smoke
