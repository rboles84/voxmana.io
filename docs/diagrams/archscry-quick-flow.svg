<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Archscry quick adaptive flow</title>
  <desc id="desc">Quick reading loads data, asks adaptive questions, applies evidence, and renders a dossier.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fbfd0"/></marker><style>.bg{fill:#121315}.box{fill:#202225;stroke:#bfa46a;rx:7}.decision{fill:#2a2217;stroke:#d0b46f}.text{fill:#f1ead7;font:13px Arial}.small{fill:#c9c0aa;font:12px Arial}.line{stroke:#8fbfd0;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="920" height="430"/>
  <rect class="box" x="35" y="55" width="125" height="52"/><text class="text" x="98" y="85" text-anchor="middle">Load page</text>
  <rect class="box" x="200" y="55" width="150" height="52"/><text class="text" x="275" y="78" text-anchor="middle">Load data</text><text class="small" x="275" y="95" text-anchor="middle">factions + model</text>
  <rect class="box" x="390" y="55" width="150" height="52"/><text class="text" x="465" y="78" text-anchor="middle">Restore reading</text><text class="small" x="465" y="95" text-anchor="middle">local v1 or safe migration</text>
  <rect class="box" x="580" y="55" width="150" height="52"/><text class="text" x="655" y="85" text-anchor="middle">Landing</text>
  <rect class="box" x="35" y="180" width="140" height="52"/><text class="text" x="105" y="203" text-anchor="middle">Start quick</text><text class="small" x="105" y="220" text-anchor="middle">initial state</text>
  <rect class="box" x="215" y="180" width="150" height="52"/><text class="text" x="290" y="203" text-anchor="middle">Select question</text><text class="small" x="290" y="220" text-anchor="middle">Gate/Hall/Crucible</text>
  <rect class="box" x="405" y="180" width="140" height="52"/><text class="text" x="475" y="210" text-anchor="middle">Render answers</text>
  <rect class="box" x="585" y="180" width="140" height="52"/><text class="text" x="655" y="203" text-anchor="middle">Apply answer</text><text class="small" x="655" y="220" text-anchor="middle">deltas + trail</text>
  <rect class="decision" x="765" y="170" width="120" height="72"/><text class="text" x="825" y="198" text-anchor="middle">Finish?</text><text class="small" x="825" y="216" text-anchor="middle">confidence/stage</text>
  <rect class="box" x="365" y="315" width="160" height="52"/><text class="text" x="445" y="338" text-anchor="middle">Build result</text><text class="small" x="445" y="355" text-anchor="middle">placement contract</text>
  <rect class="box" x="585" y="315" width="155" height="52"/><text class="text" x="663" y="338" text-anchor="middle">Render dossier</text><text class="small" x="663" y="355" text-anchor="middle">art + adjacent fits</text>
  <path class="line" d="M160 81 L200 81"/><path class="line" d="M350 81 L390 81"/><path class="line" d="M540 81 L580 81"/><path class="line" d="M655 107 L105 180"/><path class="line" d="M175 206 L215 206"/><path class="line" d="M365 206 L405 206"/><path class="line" d="M545 206 L585 206"/><path class="line" d="M725 206 L765 206"/><path class="line" d="M825 242 C825 285 490 275 290 232"/><path class="line" d="M825 242 L525 315"/><path class="line" d="M525 341 L585 341"/>
</svg>
