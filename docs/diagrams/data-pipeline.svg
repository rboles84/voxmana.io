<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Vox Mana data pipeline</title>
  <desc id="desc">Raw faction data and display data are transformed into generated model, schema, and edge context artifacts.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fbfd0"/></marker><style>.bg{fill:#121315}.box{fill:#202225;stroke:#bfa46a;rx:7}.out{fill:#172a2e;stroke:#62b7c4;rx:7}.text{fill:#f1ead7;font:14px Arial}.small{fill:#c9c0aa;font:12px Arial}.line{stroke:#8fbfd0;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="920" height="470"/>
  <rect class="box" x="55" y="70" width="210" height="64"/><text class="text" x="160" y="96" text-anchor="middle">raw factions</text><text class="small" x="160" y="116" text-anchor="middle">profile + placement + claims</text>
  <rect class="box" x="55" y="175" width="210" height="64"/><text class="text" x="160" y="201" text-anchor="middle">display surface</text><text class="small" x="160" y="221" text-anchor="middle">data/factions.json</text>
  <rect class="out" x="350" y="120" width="220" height="75"/><text class="text" x="460" y="150" text-anchor="middle">external tools</text><text class="small" x="460" y="170" text-anchor="middle">build:factions</text>
  <rect class="out" x="675" y="45" width="190" height="54"/><text class="text" x="770" y="67" text-anchor="middle">placement model</text><text class="small" x="770" y="84" text-anchor="middle">frontend quick flow</text>
  <rect class="out" x="675" y="125" width="190" height="54"/><text class="text" x="770" y="147" text-anchor="middle">schema</text><text class="small" x="770" y="164" text-anchor="middle">contract docs/tests</text>
  <rect class="out" x="675" y="205" width="190" height="54"/><text class="text" x="770" y="227" text-anchor="middle">faction context</text><text class="small" x="770" y="244" text-anchor="middle">edge prompt</text>
  <rect class="box" x="675" y="315" width="190" height="54"/><text class="text" x="770" y="337" text-anchor="middle">Archscry</text><text class="small" x="770" y="354" text-anchor="middle">dossier + scoring</text>
  <rect class="box" x="430" y="315" width="190" height="54"/><text class="text" x="525" y="337" text-anchor="middle">Audit + validation</text><text class="small" x="525" y="354" text-anchor="middle">comparison consumers</text>
  <path class="line" d="M265 102 L350 145"/><path class="line" d="M265 207 L350 170"/><path class="line" d="M570 145 L675 72"/><path class="line" d="M570 155 L675 152"/><path class="line" d="M570 170 L675 232"/><path class="line" d="M770 99 L770 315"/><path class="line" d="M770 259 L560 315"/>
</svg>
