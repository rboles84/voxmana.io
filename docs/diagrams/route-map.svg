<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Vox Mana route map</title>
  <desc id="desc">Public routes and their primary JavaScript runtimes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fbfd0"/></marker><style>.bg{fill:#121315}.route{fill:#202225;stroke:#bfa46a;rx:7}.run{fill:#172a2e;stroke:#62b7c4;rx:7}.text{fill:#f1ead7;font:14px Arial}.small{fill:#c9c0aa;font:12px Arial}.line{stroke:#8fbfd0;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="920" height="430"/>
  <rect class="route" x="45" y="45" width="145" height="52"/><text class="text" x="117" y="75" text-anchor="middle">/</text>
  <rect class="run" x="245" y="45" width="190" height="52"/><text class="text" x="340" y="68" text-anchor="middle">home.js</text><text class="small" x="340" y="86" text-anchor="middle">stars + orbs + pointer</text>
  <rect class="route" x="45" y="125" width="145" height="52"/><text class="text" x="117" y="155" text-anchor="middle">/archscry/</text>
  <rect class="run" x="245" y="125" width="190" height="52"/><text class="text" x="340" y="148" text-anchor="middle">index.js</text><text class="small" x="340" y="166" text-anchor="middle">quick + Atlas + dossier</text>
  <rect class="route" x="45" y="205" width="145" height="52"/><text class="text" x="117" y="235" text-anchor="middle">/maze/</text>
  <rect class="run" x="245" y="205" width="190" height="52"/><text class="text" x="340" y="228" text-anchor="middle">research-init.js</text><text class="small" x="340" y="246" text-anchor="middle">Smart/raw/builder</text>
  <rect class="route" x="45" y="285" width="145" height="52"/><text class="text" x="117" y="315" text-anchor="middle">/apocrypha/</text>
  <rect class="route" x="45" y="355" width="145" height="52"/><text class="text" x="117" y="385" text-anchor="middle">/privacy/, /terms/</text>
  <rect class="run" x="520" y="115" width="180" height="70"/><text class="text" x="610" y="145" text-anchor="middle">shared runtime</text><text class="small" x="610" y="164" text-anchor="middle">topbar + atmosphere</text>
  <rect class="run" x="520" y="265" width="220" height="70"/><text class="text" x="630" y="294" text-anchor="middle">command panel</text><text class="small" x="630" y="313" text-anchor="middle">server.mjs + panel.js</text>
  <rect class="route" x="775" y="275" width="110" height="52"/><text class="text" x="830" y="305" text-anchor="middle">:4783</text>
  <line class="line" x1="190" y1="71" x2="245" y2="71"/><line class="line" x1="190" y1="151" x2="245" y2="151"/><line class="line" x1="190" y1="231" x2="245" y2="231"/><line class="line" x1="190" y1="311" x2="520" y2="170"/><line class="line" x1="190" y1="381" x2="520" y2="170"/>
  <line class="line" x1="435" y1="71" x2="520" y2="140"/><line class="line" x1="435" y1="151" x2="520" y2="151"/><line class="line" x1="435" y1="231" x2="520" y2="165"/><line class="line" x1="775" y1="301" x2="740" y2="301"/>
</svg>
