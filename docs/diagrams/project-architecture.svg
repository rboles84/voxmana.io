<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Vox Mana project architecture</title>
  <desc id="desc">Static browser routes share runtime helpers, generated data, device-local state, Scryfall, and local tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8fbfd0"/></marker>
    <style>
      .bg{fill:#121315}.box{fill:#1f2428;stroke:#bfa46a;stroke-width:1.4;rx:7}.accent{fill:#172a2e;stroke:#62b7c4}.text{fill:#f1ead7;font:14px Arial,sans-serif}.small{fill:#c9c0aa;font:12px Arial,sans-serif}.line{stroke:#8fbfd0;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="920" height="520"/>
  <rect class="box" x="370" y="25" width="180" height="54"/><text class="text" x="460" y="48" text-anchor="middle">Browser static site</text><text class="small" x="460" y="66" text-anchor="middle">HTML + CSS + JS</text>
  <rect class="box" x="65" y="135" width="160" height="60"/><text class="text" x="145" y="160" text-anchor="middle">Home gateway</text><text class="small" x="145" y="178" text-anchor="middle">index.html + home.js</text>
  <rect class="box" x="270" y="135" width="170" height="60"/><text class="text" x="355" y="160" text-anchor="middle">Archscry</text><text class="small" x="355" y="178" text-anchor="middle">placement + dossier</text>
  <rect class="box" x="480" y="135" width="170" height="60"/><text class="text" x="565" y="160" text-anchor="middle">Implicit Maze</text><text class="small" x="565" y="178" text-anchor="middle">Scryfall research</text>
  <rect class="box" x="695" y="135" width="160" height="60"/><text class="text" x="775" y="160" text-anchor="middle">Apocrypha</text><text class="small" x="775" y="178" text-anchor="middle">source library</text>
  <rect class="accent" x="265" y="260" width="180" height="60"/><text class="text" x="355" y="285" text-anchor="middle">Generated data</text><text class="small" x="355" y="303" text-anchor="middle">factions + model</text>
  <rect class="accent" x="475" y="260" width="180" height="60"/><text class="text" x="565" y="285" text-anchor="middle">Shared runtime</text><text class="small" x="565" y="303" text-anchor="middle">shared, topbar, motion</text>
  <rect class="box" x="65" y="395" width="170" height="60"/><text class="text" x="150" y="420" text-anchor="middle">External tools</text><text class="small" x="150" y="438" text-anchor="middle">build + command panel</text>
  <rect class="box" x="320" y="395" width="170" height="60"/><text class="text" x="405" y="420" text-anchor="middle">Local reading</text><text class="small" x="405" y="438" text-anchor="middle">v1 + Maze handoff</text>
  <rect class="box" x="555" y="395" width="150" height="60"/><text class="text" x="630" y="420" text-anchor="middle">Reading Finds</text><text class="small" x="630" y="438" text-anchor="middle">separate local state</text>
  <rect class="box" x="735" y="395" width="140" height="60"/><text class="text" x="805" y="420" text-anchor="middle">Scryfall</text><text class="small" x="805" y="438" text-anchor="middle">cards API</text>
  <path class="line" d="M425 80 L155 135"/><path class="line" d="M445 80 L365 135"/><path class="line" d="M475 80 L555 135"/><path class="line" d="M500 80 L765 135"/>
  <path class="line" d="M355 195 L355 260"/><path class="line" d="M440 175 L515 260"/><path class="line" d="M565 195 L565 260"/><path class="line" d="M775 195 L615 260"/>
  <path class="line" d="M150 395 L320 320"/><path class="line" d="M355 195 L405 395"/><path class="line" d="M565 195 L630 395"/><path class="line" d="M565 320 L805 395"/>
</svg>
