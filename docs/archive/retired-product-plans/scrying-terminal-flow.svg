<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">Scrying Terminal flow</title>
  <desc id="desc">Interview messages travel from frontend shared helpers to the Supabase edge function, Anthropic, and normalized result handling.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fbfd0"/></marker><style>.bg{fill:#121315}.box{fill:#202225;stroke:#bfa46a;rx:7}.edge{fill:#172a2e;stroke:#62b7c4;rx:7}.decision{fill:#2a2217;stroke:#d0b46f}.text{fill:#f1ead7;font:13px Arial}.small{fill:#c9c0aa;font:12px Arial}.line{stroke:#8fbfd0;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="920" height="450"/>
  <rect class="box" x="40" y="70" width="145" height="54"/><text class="text" x="112" y="93" text-anchor="middle">User reply</text><text class="small" x="112" y="110" text-anchor="middle">terminal input</text>
  <rect class="box" x="235" y="70" width="160" height="54"/><text class="text" x="315" y="93" text-anchor="middle">shared.js</text><text class="small" x="315" y="110" text-anchor="middle">vm_conductInterview</text>
  <rect class="edge" x="445" y="70" width="170" height="54"/><text class="text" x="530" y="93" text-anchor="middle">edge function</text><text class="small" x="530" y="110" text-anchor="middle">validate + rate limit</text>
  <rect class="edge" x="665" y="70" width="170" height="54"/><text class="text" x="750" y="93" text-anchor="middle">Prompt context</text><text class="small" x="750" y="110" text-anchor="middle">generated faction data</text>
  <rect class="box" x="665" y="190" width="170" height="54"/><text class="text" x="750" y="213" text-anchor="middle">Anthropic</text><text class="small" x="750" y="230" text-anchor="middle">JSON text</text>
  <rect class="edge" x="445" y="190" width="170" height="54"/><text class="text" x="530" y="213" text-anchor="middle">Parse response</text><text class="small" x="530" y="230" text-anchor="middle">strip fences + JSON</text>
  <rect class="decision" x="255" y="180" width="120" height="74"/><text class="text" x="315" y="210" text-anchor="middle">Decided?</text><text class="small" x="315" y="228" text-anchor="middle">usable result</text>
  <rect class="box" x="80" y="310" width="160" height="54"/><text class="text" x="160" y="333" text-anchor="middle">Next question</text><text class="small" x="160" y="350" text-anchor="middle">continue interview</text>
  <rect class="box" x="390" y="310" width="180" height="54"/><text class="text" x="480" y="333" text-anchor="middle">Normalize result</text><text class="small" x="480" y="350" text-anchor="middle">shared contract</text>
  <rect class="box" x="635" y="310" width="160" height="54"/><text class="text" x="715" y="333" text-anchor="middle">Dossier</text><text class="small" x="715" y="350" text-anchor="middle">decree + save</text>
  <path class="line" d="M185 97 L235 97"/><path class="line" d="M395 97 L445 97"/><path class="line" d="M615 97 L665 97"/><path class="line" d="M750 124 L750 190"/><path class="line" d="M665 217 L615 217"/><path class="line" d="M445 217 L375 217"/><path class="line" d="M315 254 L160 310"/><path class="line" d="M315 254 L480 310"/><path class="line" d="M570 337 L635 337"/><path class="line" d="M160 310 C40 230 40 140 40 97"/>
</svg>
